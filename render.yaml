# Render Blueprint — free demo hosting (no paid plan)
# Dashboard: https://dashboard.render.com → New → Blueprint → this repo
#
# Free plan: $0, but sleeps after ~15 min idle (first open can take 30–60s).
# No credit card needed for Free on many accounts; if Render still asks to pay,
# use Railway free trial or keep the local cloudflared tunnel instead.

services:
  - type: web
    name: sori-with
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SORI_WITH_ENVIRONMENT
        value: production
      - key: SORI_WITH_ALLOW_PATH_ANALYZE
        value: "false"
      - key: SORI_WITH_MAX_UPLOAD_BYTES
        value: "20971520"
      - key: SORI_WITH_CORS_ORIGINS
        value: "*"
      - key: SORI_WITH_KEEP_UPLOAD_ARTIFACTS
        value: "false"
