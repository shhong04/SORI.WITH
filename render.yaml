# Render Blueprint — 3-day demo hosting (Free plan, no payment)
# Dashboard: https://dashboard.render.com → New → Blueprint → this repo
#
# Free plan sleeps after ~15 min idle; first request after sleep is slow (cold start).
# Optional: upgrade to "starter" in the dashboard only if you need always-on.

services:
  - type: web
    name: sori-with
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SORI_WITH_ENVIRONMENT
        value: production
      - key: SORI_WITH_ALLOW_PATH_ANALYZE
        value: "false"
      - key: SORI_WITH_MAX_UPLOAD_BYTES
        value: "20971520"
      - key: SORI_WITH_CORS_ORIGINS
        value: "*"
      - key: SORI_WITH_KEEP_UPLOAD_ARTIFACTS
        value: "false"
