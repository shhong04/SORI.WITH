<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SORI.WITH · 모니터 HUD</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
  :root{
    --bg:#0C0C0C; --ink:#fff; --muted:#9A9690; --accent:#E02020;
    --card:rgba(255,255,255,0.035); --line:rgba(255,255,255,0.09);
    --guitar:#E8823C; --bass:#5B8CFF; --drums:#E02020; --vocal:#3DBF6E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#050505;color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;}
  body{
    min-height:100%;
    background:
      radial-gradient(1100px 560px at 90% -15%, rgba(224,32,32,0.2), transparent 55%),
      radial-gradient(800px 480px at 0% 110%, rgba(224,32,32,0.08), transparent 50%),
      #050505;
    padding:28px 32px 36px;
  }
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;}
  .brand{font-size:clamp(1.8rem,3vw,2.6rem);font-weight:800;letter-spacing:-0.03em;}
  .brand span{color:var(--accent);}
  .sub{color:var(--muted);margin:.35rem 0 0;font-size:1rem;}
  .ops{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;}
  button{
    appearance:none;border:none;border-radius:12px;padding:.7rem 1rem;font-weight:700;
    font-family:inherit;cursor:pointer;font-size:.9rem;
  }
  .primary{background:var(--accent);color:#fff;}
  .secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line);}
  .badge{
    padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);font-size:.8rem;
  }
  .badge.live{color:#c8f0d4;border-color:rgba(61,191,110,.4);}
  .grid{display:grid;grid-template-columns:1.35fr .9fr;gap:1rem;}
  @media (max-width:960px){.grid{grid-template-columns:1fr;}}
  section{
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.1rem 1.2rem 1.25rem;
  }
  h2{margin:0 0 .85rem;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
  .lanes{display:flex;flex-direction:column;gap:.7rem;}
  .lane{
    position:relative;border-radius:16px;border:1px solid var(--line);
    background:rgba(0,0,0,.28);padding:1rem 1.1rem;min-height:84px;
    transition:box-shadow .2s ease, border-color .2s ease, transform .2s ease;
  }
  .lane .name{font-weight:800;font-size:1.15rem;}
  .lane .meta{color:var(--muted);font-size:.88rem;margin-top:.25rem;}
  .lane .pulse{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border-radius:50%;background:var(--p);opacity:.35;
  }
  .lane.on{
    border-color:var(--p);
    box-shadow:0 0 0 1px var(--p), 0 0 36px color-mix(in srgb, var(--p) 40%, transparent);
    transform:scale(1.01);
  }
  .lane.on .pulse{opacity:1;box-shadow:0 0 16px var(--p);animation:blink 1.1s ease infinite;}
  @keyframes blink{50%{opacity:.45}}
  .hud-canvas{
    width:100%;height:160px;border-radius:14px;background:#0a0a0a;border:1px solid var(--line);
    margin-top:.85rem;display:block;
  }
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}
  .metric{
    border:1px solid var(--line);border-radius:14px;padding:.75rem .85rem;background:rgba(0,0,0,.25);
  }
  .metric b{display:block;font-size:1.25rem;margin-top:.2rem;}
  .metric span{color:var(--muted);font-size:.75rem;}
  table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.5rem;}
  th,td{text-align:left;padding:.4rem .2rem;border-bottom:1px solid rgba(255,255,255,.06);}
  th{color:var(--muted);font-weight:600;font-size:.75rem;}
  .join-url{
    margin-top:.8rem;font-size:.85rem;color:var(--muted);word-break:break-all;
  }
  .join-url a{color:#fff;}
  .err{color:#ffb4b0;font-size:.9rem;margin-top:.5rem;}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">SORI<span>.</span>WITH</div>
    <p class="sub">참여형 모니터 HUD · 파트 하이라이트 + 오프라인 분석</p>
  </div>
  <div class="ops">
    <span class="badge" id="conn">connecting…</span>
    <span class="badge" id="status">open</span>
    <button class="primary" id="btnAnalyze" type="button">분석 실행</button>
    <button class="secondary" id="btnReset" type="button">리셋</button>
  </div>
</header>

<div class="grid">
  <section>
    <h2>Ensemble HUD</h2>
    <div class="lanes" id="lanes"></div>
    <canvas class="hud-canvas" id="roll" width="900" height="160"></canvas>
    <p class="join-url">관객 참여: <a id="audLink" href="/web/demo-audience.html" target="_blank">/web/demo-audience.html</a>
      · 같은 Wi‑Fi면 <code id="lanHint"></code></p>
  </section>

  <section>
    <h2>Analyze result</h2>
    <div class="metrics">
      <div class="metric"><span>median tempo</span><b id="mTempo">—</b></div>
      <div class="metric"><span>reference</span><b id="mRef">—</b></div>
      <div class="metric"><span>state</span><b id="mState">—</b></div>
      <div class="metric"><span>parts w/ audio</span><b id="mParts">0</b></div>
    </div>
    <table>
      <thead><tr><th>part</th><th>align</th><th>timing ms</th><th>signed</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="err" id="err"></div>
  </section>
</div>

<script>
const API = `${location.origin}/api/v1`;
const PART_META = [
  {id:"guitar", label:"Guitar", color:"#E8823C"},
  {id:"bass", label:"Bass", color:"#5B8CFF"},
  {id:"drums", label:"Drums", color:"#E02020"},
  {id:"vocal", label:"Vocal", color:"#3DBF6E"},
];

const lanesEl = document.getElementById("lanes");
PART_META.forEach(p=>{
  const d = document.createElement("div");
  d.className = "lane";
  d.id = "lane-"+p.id;
  d.style.setProperty("--p", p.color);
  d.innerHTML = `<div class="name" style="color:${p.color}">${p.label}</div>
    <div class="meta" id="meta-${p.id}">대기</div>
    <div class="pulse"></div>`;
  lanesEl.appendChild(d);
});

document.getElementById("audLink").href = location.origin + "/web/demo-audience.html";
// best-effort LAN hint
fetch("/health").then(()=>{
  document.getElementById("lanHint").textContent =
    `http://<MacIP>:${location.port||8000}/web/demo-audience.html`;
}).catch(()=>{});

let stage = null;
let animT = 0;

function render(s){
  stage = s;
  document.getElementById("status").textContent = s.status || "—";
  document.getElementById("mParts").textContent = (s.partsWithAudio||[]).length;
  document.getElementById("err").textContent = s.lastError || "";

  const byPart = {};
  (s.members||[]).forEach(m=>{ byPart[m.partId]=m; });
  const hi = new Set(s.highlightedParts||[]);

  PART_META.forEach(p=>{
    const lane = document.getElementById("lane-"+p.id);
    const meta = document.getElementById("meta-"+p.id);
    const m = byPart[p.id];
    lane.classList.toggle("on", hi.has(p.id));
    if(!m){ meta.textContent = "비어 있음"; return; }
    meta.textContent = `${m.displayName} · ${m.hasAudio ? "오디오 있음" : "선택만 됨"}`;
  });

  const dash = s.dashboard;
  if(dash){
    const clock = dash.clock || {};
    document.getElementById("mTempo").textContent =
      clock.median_tempo != null ? Number(clock.median_tempo).toFixed(1) : "—";
    document.getElementById("mRef").textContent = clock.reference_part_id || "—";
    const hist = dash.stateHistogram || {};
    const top = Object.entries(hist).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById("mState").textContent = top ? top[0] : "—";

    const align = dash.partAlignmentConfidence || {};
    const timing = dash.partTimingDeviationMs || {};
    const signed = dash.partSignedTimingDeviationMs || {};
    const tb = document.getElementById("tbody");
    tb.innerHTML = (dash.parts||Object.keys(align)).map(part=>{
      const a = align[part]; const t = timing[part]; const sg = signed[part];
      return `<tr><td>${part}</td>
        <td>${a==null?"—":Number(a).toFixed(3)}</td>
        <td>${t==null?"—":Number(t).toFixed(1)}</td>
        <td>${sg==null?"—":(sg>=0?"+":"")+Number(sg).toFixed(1)}</td></tr>`;
    }).join("");
  }
}

function drawRoll(){
  const c = document.getElementById("roll");
  const ctx = c.getContext("2d");
  const w = c.width, h = c.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0,0,w,h);
  const hi = new Set((stage && stage.highlightedParts) || []);
  const audio = new Set((stage && stage.partsWithAudio) || []);
  PART_META.forEach((p,i)=>{
    const y0 = 12 + i*((h-24)/4);
    const yh = (h-24)/4 - 8;
    ctx.globalAlpha = hi.has(p.id) ? 1 : 0.35;
    ctx.strokeStyle = p.color;
    ctx.fillStyle = p.color;
    ctx.lineWidth = hi.has(p.id) ? 2.5 : 1;
    // fake piano-roll pulses
    for(let x=20; x<w-20; x+=28){
      const phase = Math.sin((x+animT*2)*0.04 + i);
      if(phase < (audio.has(p.id) ? 0.15 : 0.55)) continue;
      const bh = yh * (0.35 + 0.55*((phase+1)/2));
      ctx.fillRect(x, y0 + yh - bh, 10, bh);
    }
    if(hi.has(p.id)){
      ctx.strokeRect(8, y0-2, w-16, yh+4);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.color;
    ctx.font = "600 12px Pretendard, sans-serif";
    ctx.fillText(p.label, 14, y0+12);
  });
  animT += 1;
  requestAnimationFrame(drawRoll);
}
drawRoll();

function connectWs(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/v1/ws/demo/stage`);
  const conn = document.getElementById("conn");
  ws.onopen = ()=>{ conn.textContent = "live"; conn.classList.add("live"); };
  ws.onclose = ()=>{
    conn.textContent = "reconnecting…"; conn.classList.remove("live");
    setTimeout(connectWs, 1200);
  };
  ws.onmessage = (ev)=>{
    try{
      const msg = JSON.parse(ev.data);
      if(msg.type === "demo_stage" && msg.stage) render(msg.stage);
    }catch(_){}
  };
}

document.getElementById("btnAnalyze").onclick = async ()=>{
  document.getElementById("err").textContent = "분석 중…";
  try{
    const res = await fetch(`${API}/demo/stage/analyze`, {method:"POST"});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : res.status);
    render(data);
  }catch(e){
    document.getElementById("err").textContent = "분석 실패: "+e.message;
  }
};

document.getElementById("btnReset").onclick = async ()=>{
  await fetch(`${API}/demo/stage/reset`, {method:"POST"});
};

fetch(`${API}/demo/stage`).then(r=>r.json()).then(render).catch(e=>{
  document.getElementById("err").textContent = "stage load failed — is the server running?";
});
connectWs();
</script>
</body>
</html>
