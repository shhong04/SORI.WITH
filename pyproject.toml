[project]
name = "sori-with"
version = "0.1.0"
description = "SORI.WITH AI Ensemble Platform — Phase 1 Offline Ensemble Analysis backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "soundfile>=0.12.1",
  "mido>=1.3.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sori_with*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
